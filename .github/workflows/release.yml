name: Release

# Pushes to main publish a beta of each package with pending changelog
# fragments. Running this workflow manually publishes betas like a push does,
# to retry a push's release that failed and was rolled back. Checking `stable`
# instead promotes the selected packages' betas to stable releases.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stable:
        description: Stable release? (unchecked publishes betas, e.g. to retry a failed push release)
        type: boolean
        default: false
      package:
        description: Package to release
        type: choice
        default: all
        options:
          - all
          - algokit-utils
          - algokit-client-generator
          - algokit-subscriber

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # PyPI trusted publishing
  id-token: write

# Each package releases independently. The jobs run one at a time, because each
# pushes a release commit to main, in dependency order (utils, then
# client-generator, then subscriber). A job skipped by the package input doesn't
# skip the jobs after it.
# Start at the CI-tested SHA and pass only this run's release commits forward.
# If main advances independently, stop instead of releasing unvalidated code.
#
# The shared steps live in the `release-package` composite action. PyPI trusted
# publishing doesn't work from a reusable workflow, so each package's
# `pypi-publish` and rollback steps are in its job here.
#
# Pushes made by the release bot don't release, in case one lacks `[skip ci]`,
# so a failing release can't retrigger itself. The later jobs check
# `needs.ci.result`, because their `!cancelled()` would run them after a skipped
# ci.
jobs:
  ci:
    if: ${{ github.event_name != 'push' || github.actor != 'engineering-ci[bot]' }}
    uses: ./.github/workflows/ci.yml

  algokit-utils:
    needs: ci
    if: ${{ github.event_name == 'push' || contains(fromJSON('["all","algokit-utils"]'), inputs.package) }}
    runs-on: ubuntu-latest
    outputs:
      commit-sha: ${{ steps.release.outputs.commit-sha || github.sha }}
    steps:
      - name: Generate bot token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app_token
        with:
          app-id: ${{ secrets.BOT_ID }}
          private-key: ${{ secrets.BOT_SK }}

      # Never absorb unrelated changes from a moving main.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Release
        id: release
        uses: ./.github/actions/release-package
        with:
          package: algokit-utils-py
          tag-prefix: algokit-utils-v
          prerelease: ${{ (github.event_name == 'push' || !inputs.stable) && 'beta' || '' }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: algokit-utils-py/dist/
          skip-existing: true
          verbose: true

      - name: Roll back failed release
        if: failure() || cancelled()
        uses: joe-p/semfrag/actions/rollback@52b58d46a190e343201a202c9b4aab993e58b7b4 # v0.11.1
        with:
          token: ${{ steps.app_token.outputs.token }}

  algokit-client-generator:
    needs: [ci, algokit-utils]
    if: ${{ !cancelled() && needs.ci.result == 'success' && !contains(needs.*.result, 'failure') && (github.event_name == 'push' || contains(fromJSON('["all","algokit-client-generator"]'), inputs.package)) }}
    runs-on: ubuntu-latest
    outputs:
      commit-sha: ${{ steps.release.outputs.commit-sha || needs.algokit-utils.outputs.commit-sha || github.sha }}
    steps:
      - name: Generate bot token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app_token
        with:
          app-id: ${{ secrets.BOT_ID }}
          private-key: ${{ secrets.BOT_SK }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.algokit-utils.outputs.commit-sha || github.sha }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Release
        id: release
        uses: ./.github/actions/release-package
        with:
          package: algokit-client-generator-py
          tag-prefix: algokit-client-generator-v
          prerelease: ${{ (github.event_name == 'push' || !inputs.stable) && 'beta' || '' }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: algokit-client-generator-py/dist/
          skip-existing: true
          verbose: true

      - name: Roll back failed release
        if: failure() || cancelled()
        uses: joe-p/semfrag/actions/rollback@52b58d46a190e343201a202c9b4aab993e58b7b4 # v0.11.1
        with:
          token: ${{ steps.app_token.outputs.token }}

  algokit-subscriber:
    needs: [ci, algokit-utils, algokit-client-generator]
    if: ${{ !cancelled() && needs.ci.result == 'success' && !contains(needs.*.result, 'failure') && (github.event_name == 'push' || contains(fromJSON('["all","algokit-subscriber"]'), inputs.package)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate bot token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app_token
        with:
          app-id: ${{ secrets.BOT_ID }}
          private-key: ${{ secrets.BOT_SK }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.algokit-client-generator.outputs.commit-sha || needs.algokit-utils.outputs.commit-sha || github.sha }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Release
        id: release
        uses: ./.github/actions/release-package
        with:
          package: algokit-subscriber-py
          tag-prefix: algokit-subscriber-v
          prerelease: ${{ (github.event_name == 'push' || !inputs.stable) && 'beta' || '' }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: algokit-subscriber-py/dist/
          skip-existing: true
          verbose: true

      - name: Roll back failed release
        if: failure() || cancelled()
        uses: joe-p/semfrag/actions/rollback@52b58d46a190e343201a202c9b4aab993e58b7b4 # v0.11.1
        with:
          token: ${{ steps.app_token.outputs.token }}
