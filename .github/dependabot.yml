# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# The packages are members of one uv workspace with a single root `uv.lock`.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
