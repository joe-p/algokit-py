# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# Each package is its own uv project with its own `uv.lock`, so each directory is updated separately.
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/algokit-utils-py"
      - "/algokit-client-generator-py"
      - "/algokit-subscriber-py"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
