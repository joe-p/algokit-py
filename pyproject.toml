# uv workspace root. This is not a package and is never published.
#
# Every package shares the single root `uv.lock`, so each dependency resolves to
# one version across the workspace.
#
# Dev dependency versions are defined once, in `constraint-dependencies` below,
# like a pnpm catalog: each package lists its dev dependencies in its
# `[dependency-groups]` by name only. Constraints only limit versions, so a
# package still needs to list a dev dependency to install it.
#
# Runtime `dependencies` keep their own ranges in each package's
# `pyproject.toml`, because they're published as the package's requirements.
# The shared lock still resolves them to one version.

[tool.uv.workspace]
members = ["algokit-utils-py", "algokit-client-generator-py", "algokit-subscriber-py"]

[tool.uv]
constraint-dependencies = [
  # Tooling
  "click>=8.3.3,<9",
  "mypy>=2.1.0,<3",
  "pip-audit>=2.10.0,<3",
  "poethepoet>=0.46.0,<0.47",
  "ruff>=0.15.0,<0.16",
  "setuptools>=84.1.0,<85",
  "types-deprecated>=1.2.15.20241117,<2",

  # Testing
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1.0,<8",
  "pytest-httpx>=0.36.0,<0.37",
  "pytest-mock>=3.14,<4",
  "pytest-sugar>=1.0.0,<2",
  "pytest-xdist>=3.6.1,<4",
  "python-dotenv>=1.0.0,<2",
  "puyapy>=5.8.0,<6",
  "algorand-python>=3.4.0,<4",

  # Docs
  "linkify-it-py>=2.0.3,<3",
  "pydoclint>=0.6.0,<0.7",
  "sphinx>=8.0.0,<9",
  "sphinx-autoapi>=3.4.0,<4",
  "sphinx-markdown-builder>=0.6.8,<0.7",

  # Floors for transitive dev dependencies, to keep pip-audit off vulnerable
  # versions. filelock's fixes need Python 3.11, so Python 3.10 keeps the
  # vulnerable 3.x (a dev-only dependency of pip-audit), and CI audits on 3.12.
  "filelock>=3.20.1,<4; python_version < '3.11'",
  "filelock>=4.2.1,<5; python_version >= '3.11'",
  "pip>=26.1.2,<27",
  "pygments>=2.20.0,<3",
  "requests>=2.33.0,<3",
]
